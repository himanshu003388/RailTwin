<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="680" fill="url(#bg)" rx="12"/>
  <text x="500" y="38" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700" filter="url(#glow)">RailTwin AI — Architecture Overview</text>
  <text x="500" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Astro SSR · React 19 · MapLibre GL · Gemini AI · Ridge Regression · SQLite · Vercel</text>

  <!-- Layer labels -->
  <text x="30" y="105" fill="#3b82f6" font-size="11" font-weight="600" letter-spacing="1">DATA SOURCES</text>
  <line x1="30" y1="110" x2="970" y2="110" stroke="#334155" stroke-width="1"/>

  <!-- Data Sources row -->
  <rect x="30" y="125" width="220" height="65" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="147" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">7 Real IR Trains</text>
  <text x="140" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">Mumbai/HWH/Dibrugarh Rajdhani</text>
  <text x="140" y="180" text-anchor="middle" fill="#94a3b8" font-size="10">Punjab Mail · Kerala · Purushottam</text>

  <rect x="265" y="125" width="160" height="65" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="345" y="147" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">36 Junction Stations</text>
  <text x="345" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">All 11 IR Zones</text>
  <text x="345" y="180" text-anchor="middle" fill="#94a3b8" font-size="10">lat/lng · zone codes</text>

  <rect x="440" y="125" width="180" height="65" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="530" y="147" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">Historical Delays</text>
  <text x="530" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">576 records, 12 months</text>
  <text x="530" y="180" text-anchor="middle" fill="#94a3b8" font-size="10">7 weather conditions</text>

  <rect x="635" y="125" width="155" height="65" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="712" y="147" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">OpenWeatherMap</text>
  <text x="712" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">Live per-station</text>
  <text x="712" y="180" text-anchor="middle" fill="#94a3b8" font-size="10">Temp · rain · visibility</text>

  <rect x="805" y="125" width="155" height="65" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="882" y="147" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">Gemini AI</text>
  <text x="882" y="165" text-anchor="middle" fill="#94a3b8" font-size="10">2.0 Flash / 2.5 Flash</text>
  <text x="882" y="180" text-anchor="middle" fill="#94a3b8" font-size="10">Auto-fallback + LRU</text>

  <!-- Arrow from Data Sources to Backend -->
  <line x1="500" y1="195" x2="500" y2="225" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backend layer -->
  <text x="30" y="240" fill="#8b5cf6" font-size="11" font-weight="600" letter-spacing="1">BACKEND — ASTRO SSR (Vercel Serverless)</text>
  <line x1="30" y1="245" x2="970" y2="245" stroke="#334155" stroke-width="1"/>

  <rect x="30" y="260" width="940" height="145" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- API Routes -->
  <rect x="45" y="272" width="295" height="55" rx="5" fill="#2e1065" stroke="#a78bfa" stroke-width="1"/>
  <text x="192" y="292" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">API Routes (18 endpoints)</text>
  <text x="192" y="308" text-anchor="middle" fill="#94a3b8" font-size="9">/api/trains · /api/stations · /api/trains/predict</text>
  <text x="192" y="320" text-anchor="middle" fill="#94a3b8" font-size="9">/api/sse/train-updates · /api/copilot/chat · /api/weather/corridor</text>

  <rect x="355" y="272" width="295" height="55" rx="5" fill="#2e1065" stroke="#a78bfa" stroke-width="1"/>
  <text x="502" y="292" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">ML &amp; AI Services</text>
  <text x="502" y="308" text-anchor="middle" fill="#94a3b8" font-size="9">Ridge Regression (R²=0.73)</text>
  <text x="502" y="320" text-anchor="middle" fill="#94a3b8" font-size="9">Gemini Copilot · Fallback chain</text>

  <rect x="665" y="272" width="290" height="55" rx="5" fill="#2e1065" stroke="#a78bfa" stroke-width="1"/>
  <text x="810" y="292" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Data &amp; Persistence</text>
  <text x="810" y="308" text-anchor="middle" fill="#94a3b8" font-size="9">SQLite (WAL) · delay-model-weights.json</text>
  <text x="810" y="320" text-anchor="middle" fill="#94a3b8" font-size="9">Station GeoJSON · Train routes</text>

  <!-- Weather fallback chain -->
  <rect x="45" y="337" width="910" height="58" rx="5" fill="#1e1b4b" stroke="#a78bfa" stroke-width="0.5"/>
  <text x="500" y="356" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">Weather Intelligence — 4-Tier Fallback Chain</text>
  <text x="500" y="376" text-anchor="middle" fill="#94a3b8" font-size="9">OpenWeatherMap → Open-Meteo → Seasonal Estimation (monsoon/winter/coastal/summer) → Default Clear</text>
  <text x="500" y="390" text-anchor="middle" fill="#64748b" font-size="9">15-min in-memory cache · Max 3 concurrent requests · Monsoon-sensitive zone weighting</text>

  <!-- Arrow from Backend to Frontend -->
  <line x1="500" y1="410" x2="500" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Frontend layer -->
  <text x="30" y="458" fill="#06b6d4" font-size="11" font-weight="600" letter-spacing="1">FRONTEND — React 19 + Zustand v5 (Browser)</text>
  <line x1="30" y1="463" x2="970" y2="463" stroke="#334155" stroke-width="1"/>

  <rect x="30" y="478" width="940" height="145" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Components grid -->
  <rect x="45" y="490" width="200" height="55" rx="5" fill="#164e63" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="145" y="510" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">🗺️ Corridor Map</text>
  <text x="145" y="527" text-anchor="middle" fill="#94a3b8" font-size="9">MapLibre GL · SSE live updates</text>
  <text x="145" y="539" text-anchor="middle" fill="#94a3b8" font-size="9">Train markers · Weather HUD</text>

  <rect x="260" y="490" width="200" height="55" rx="5" fill="#164e63" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="360" y="510" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">📊 Delay Chart</text>
  <text x="360" y="527" text-anchor="middle" fill="#94a3b8" font-size="9">Recharts area chart</text>
  <text x="360" y="539" text-anchor="middle" fill="#94a3b8" font-size="9">7-train delay overlay</text>

  <rect x="475" y="490" width="200" height="55" rx="5" fill="#164e63" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="575" y="510" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">🤖 AI Copilot</text>
  <text x="575" y="527" text-anchor="middle" fill="#94a3b8" font-size="9">Gemini chat · Live context</text>
  <text x="575" y="539" text-anchor="middle" fill="#94a3b8" font-size="9">Multi-turn history</text>

  <rect x="690" y="490" width="265" height="55" rx="5" fill="#164e63" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="822" y="510" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="600">What-If · Simulator · Health</text>
  <text x="822" y="527" text-anchor="middle" fill="#94a3b8" font-size="9">Cascade disruption · Scenario builder</text>
  <text x="822" y="539" text-anchor="middle" fill="#94a3b8" font-size="9">System health gauges</text>

  <!-- Bottom UI layer -->
  <rect x="45" y="555" width="910" height="58" rx="5" fill="#0f172a" stroke="#22d3ee" stroke-width="0.5"/>
  <text x="500" y="574" text-anchor="middle" fill="#67e8f9" font-size="10" font-weight="600">UI Layer</text>
  <text x="500" y="592" text-anchor="middle" fill="#94a3b8" font-size="9">Tailwind CSS v4 · Zustand store · Keyboard Shortcuts (1–6, Space, M) · Dark/Light Theme · Toast Notifications</text>

  <!-- Deploy badge -->
  <rect x="720" y="8" width="250" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="845" y="27" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">✅ Deployed on Vercel → rail-twin.vercel.app</text>

  <!-- SSE annotation -->
  <rect x="45" y="642" width="200" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="0.5"/>
  <text x="145" y="658" text-anchor="middle" fill="#fbbf24" font-size="10">⚡ SSE push every 5 s</text>
</svg>
