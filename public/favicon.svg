<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.8" />
  
  <!-- Subtle ambient glow -->
  <circle cx="32" cy="30" r="24" fill="url(#glowGrad)" />

  <!-- Twin Track rails in perspective at bottom -->
  <path d="M14 56 L24 46" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <path d="M50 56 L40 46" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <path d="M18 53 L46 53" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />
  <path d="M22 48 L42 48" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

  <!-- Main Train Body -->
  <rect x="18" y="12" width="28" height="34" rx="6" fill="#1e293b" stroke="url(#trainGrad)" stroke-width="2.2" />

  <!-- Aerodynamic Top Cap -->
  <path d="M24 12 C24 8 40 8 40 12" fill="none" stroke="url(#trainGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Windshield / OCC Cockpit Glass -->
  <path d="M22 18 C22 17 23 16 24 16 L40 16 C41 16 42 17 42 18 L41 26 C41 27 40 28 39 28 L25 28 C24 28 23 27 23 26 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4" />
  
  <!-- Center Digital Twin Divider Line (Split Twin) -->
  <line x1="32" y1="16" x2="32" y2="28" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Dual High-Intensity Headlights -->
  <circle cx="24" cy="38" r="2.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="40" cy="38" r="2.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- AI Pulse Diamond in Center Grill -->
  <polygon points="32,32 35.5,36 32,40 28.5,36" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Track Cowcatcher / Base Fender -->
  <path d="M20 46 L32 44 L44 46" stroke="url(#trainGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
